server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: invitation-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:nguyenquockhoa5549@gmail.com}
    password: ${MAIL_PASSWORD:jhtvliparkbpiwzb}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    stage1-expiration-ms: 300000 # 5 minutes for 2FA pending
  security:
    aes-secret: ${AES_SECRET}
  vietqr:
    bank-id: ${VIETQR_BANK_ID}
    bank-name: ${VIETQR_BANK_NAME}
    account-no: ${VIETQR_ACCOUNT_NO}
    account-name: ${VIETQR_ACCOUNT_NAME}
  payment:
    sandbox: ${PAYMENT_SANDBOX:false}
    webhook:
      token: ${PAYMENT_WEBHOOK_TOKEN}
    webhook-token: ${PAYMENT_WEBHOOK_TOKEN}
  client:
    url: ${CLIENT_URL:http://localhost:5173}
  server:
    public-url: ${APP_SERVER_PUBLIC_URL:http://localhost:8080}
  uptime:
    keep-alive:
      enabled: ${UPTIME_KEEP_ALIVE_ENABLED:true}
